name = "studio-paula-souza"
main = "serverless/worker.mjs"
compatibility_date = "2026-11-01"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "studio-paula-souza"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "MEDIA"
id = "00000000000000000000000000000000"
