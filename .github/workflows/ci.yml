name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Teste de fumaça
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar sintaxe
        run: |
          for file in server/*.js scripts/*.mjs functions/*.mjs serverless/*.mjs public/js/*.js; do
            node --check "$file"
          done

      - name: Rodar rotina de fumaça
        run: npm test

      - name: Empacotar worker (Cloudflare)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
